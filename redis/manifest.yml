apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-redis
  namespace: ecom
  labels: 
    component: redis
    project: ecom
    tire: database
spec:
  replicas: 1
  selector:
    matchLabels:
      component: redis
      project: ecom
      tire: database
  template:
    metadata:            
      labels:
        component: redis
        project: ecom
        tire: database
    spec:               
      containers:             
        - name: redis
          image: redis:7.0

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ecom
  labels:
    component: redis
    project: ecom
    tier: database
spec:
  selector:
    component: redis
    project: ecom
    tier: database
  ports:
  - protocol: TCP
    port: 6379 # service port
    targetPort: 6379 # container port