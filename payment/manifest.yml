apiVersion: v1
kind: ConfigMap
metadata:
  name: ecom-payment
  namespace: ecom
  labels:
    component: payment
    project: ecom
    tier: app
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecom-payment
  labels:
    component: payment
    project: ecom
    tier: app
type: Opaque
data:
  AMQP_USER: "cmFiYml0bXF1"  #encoded value of 'ecom'
  AMQP_PASS: "cmFiYml0bXFwcGFzcw==" #change with your encoded value of 'ecompass'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-payment
  namespace: ecom
  # deployment labels
  labels:
    component: payment
    project: ecom
    tier: app
spec:
  replicas: 1
  # These are the labels replica set use to create pod replicas, this should match pod labels
  selector:
    matchLabels:
      component: payment
      project: ecom
      tier: app
  # This is pod definition
  template:
    metadata:
      labels:
        component: payment
        project: ecom
        tier: app
    spec:
      containers:
      - name: payment
        image: mohan9866007322/payment:v1
        envFrom:
        - configMapRef:
            name: ecom-payment
        - secretRef:
            name: ecom-payment
---
apiVersion: v1
kind: Service
metadata:
  name: ecom-payment
  namespace: ecom
  labels:
    component: payment
    project: ecom
    tier: app
spec:
  selector:
    component: payment
    project: ecom
    tier: app
  ports:
  - protocol: TCP
    port: 8080 # service port
    targetPort: 8080 # container port