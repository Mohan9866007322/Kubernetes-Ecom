apiVersion: v1
kind: Namespace
metadata:
  name: ecom
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-mongodb
  namespace: ecom
  labels: 
    component: mongodb
    project: ecom
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      component: mongodb
      project: ecom
      tier: database
  template:
    metadata:            
      labels:
        component: mongodb
        project: ecom
        tier: database
    spec:               
      containers:            
        - name: mongodb
          image: mohan9866007322/mongodb:v1
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: ecom
  labels:
    component: mongodb
    project: ecom
    tier: database
spec:
  selector:
    component: mongodb
    project: ecom
    tier: database
  ports:
    - protocol: TCP
      port: 27017 
      targetPort: 27017