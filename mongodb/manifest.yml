apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecom-mongodb
  namespace: ecom
  labels: 
    component: mongodb
    project: ecom
    tier: database # Fixed typo (was 'tire')
spec:
  replicas: 1
  selector:
    matchLabels:
      component: mongodb
      project: ecom
      tier: database # Fixed typo
  template:
    metadata:            
      labels:
        component: mongodb
        project: ecom
        tier: database # Fixed typo
    spec:               
      containers:             
        - name: mongodb
          image: mohan9866007322/mongodb:v1
          # BEST PRACTICE: Explicitly declare the port
          ports:
            - containerPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: ecom
  labels:
    component: mongodb
    project: ecom
    tier: database
spec:
  selector:
    component: mongodb
    project: ecom
    tier: database
  ports:
  - protocol: TCP
    port: 27017 
    targetPort: 27017